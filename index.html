<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <div id="start-screen" class="screen active">
            <h1>Trivia Master</h1>
            <p>10 Soru Sorulacak, her soru 15 saniye.</p>
            <p>En Yüksek Skor: <span id="high-score-display">0</span></p>
            <button id="start-btn" class="btn">Oyuna Başla</button>
        </div>

        <div id="quiz-screen" class="screen">
            <div id="quiz-header">
                <span id="question-number">Sorular 1/10</span>
                <span id="timer">Süre: 15s</span>
            </div>
            <h2 id="question-text">Soru buraya Api`den gelecek</h2>
            <div id="answer-buttons" class="btn-grid">

            </div>
        </div>
        <div id="result-screen" class="screen active">
            <h2>Oyun Bitti!</h2>
            <p>Skorunuz : <span id="final-score">0</span>/100</p>
            <button id="restart-btn" class="btn">Tekrar Oyna</button>
        </div>
    </div>

    <script src="script.js">

    </script>
</body>

</html>
